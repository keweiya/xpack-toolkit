name: release-pipeline

# 可复用的「带门禁的发布流程」：单测 -> 构建 -> 资产自检 -> Docker 接口冒烟 -> 发布。
# 任何一步失败都不会动 GitHub Release（发布是最后一步，且 release.py 内部原子替换）。
on:
  workflow_call:
    inputs:
      version:
        description: "1Panel 版本，如 v2.4.0"
        required: true
        type: string
      smoke:
        description: "是否跑 Docker 接口冒烟测试"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Cache official 1Panel packages
        uses: actions/cache@v4
        with:
          path: build/dl
          key: 1panel-pkg-${{ inputs.version }}

      - name: Version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          case "$VERSION" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "bad version: $VERSION"; exit 1 ;; esac
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "构建版本：$VERSION"

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Build all platforms (no publish)
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: python3 tools/release.py --version "$VERSION" --build-only

      - name: Verify release assets
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: python3 tools/verify_release.py --release "build/release-$VERSION"

      - name: Enable arm64 emulation
        if: inputs.smoke
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Docker smoke test (linux-amd64)
        if: inputs.smoke
        env:
          VERSION: ${{ steps.version.outputs.value }}
        # 容器里的 1Panel 以 root 运行、数据库目录 0700，宿主机侧读写需要 root。
        run: |
          sudo --preserve-env=PATH,HOME "$(command -v python3)" tools/smoke_test.py \
            --arch amd64 \
            --release "build/release-$VERSION" \
            --package "build/dl/1panel-$VERSION-linux-amd64.tar.gz" \
            --orig-core "build/release-$VERSION/core-linux-amd64.orig"

      - name: Docker smoke test (linux-arm64)
        if: inputs.smoke
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          sudo --preserve-env=PATH,HOME "$(command -v python3)" tools/smoke_test.py \
            --arch arm64 \
            --release "build/release-$VERSION" \
            --package "build/dl/1panel-$VERSION-linux-arm64.tar.gz" \
            --orig-core "build/release-$VERSION/core-linux-arm64.orig"

      - name: Publish release (atomic replace)
        env:
          VERSION: ${{ steps.version.outputs.value }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/release.py --version "$VERSION" --publish --repo "$GITHUB_REPOSITORY"

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          {
            echo "### xpack-toolkit $VERSION"
            python3 -c "import json;m=json.load(open('build/release-$VERSION/manifest.json'));print('| 平台 | core sha256 |','|'.join(['---']*2),sep='\n');[print('| {} | `{}` |'.format(k,v['sha256'][:16]+'…')) for k,v in sorted(m['platforms'].items())]"
            echo
            echo "发布：https://github.com/$GITHUB_REPOSITORY/releases/tag/core-$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
