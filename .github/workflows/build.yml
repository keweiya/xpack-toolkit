name: build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Panel version (v2.3.2)"
        required: true
        default: "v2.3.2"

permissions:
  contents: write

concurrency:
  group: xpack-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  buildrelease:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build all verified platforms and publish one release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/release.py --version "$VERSION" --publish --repo "$GITHUB_REPOSITORY"
