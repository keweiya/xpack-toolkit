name: build

# 手动发布：跑与自动跟进完全相同的门禁流程（单测 -> 构建 -> 自检 -> Docker 冒烟 -> 发布）。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Panel version (v2.4.0)"
        required: true
        default: "v2.4.0"
      smoke:
        description: "是否跑 Docker 接口冒烟测试"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: xpack-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/pipeline.yml
    with:
      version: ${{ inputs.version }}
      smoke: ${{ inputs.smoke }}
    secrets: inherit
